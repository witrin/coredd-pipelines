options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: europe-west1
  _REPOSITORY: packages
  _PROJECT: $PROJECT_ID
steps:

  - id: build-jupyter
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        cd .jupyter

        patch=$(grep -oP 'version = "\K[^"]+' pyproject.toml)
        build="${patch}+$(date -u +%Y%m%d%H%M%S)"

        sed -i "s/version = \"${patch}\"/version = \"${build}\"/" pyproject.toml

        python -m pip install --upgrade pip
        python -m pip install build
        python -m build .

  - id: publish-jupyter
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        python -m pip install --upgrade pip
        python -m pip install twine keyring keyrings.google-artifactregistry-auth
        python -m twine upload \
          --skip-existing \
          --repository-url "https://${_REGION}-python.pkg.dev/${_PROJECT}/${_REPOSITORY}" \
          .jupyter/dist/*
