options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: europe-west1
  _REPOSITORY: containers
  _PROJECT: $PROJECT_ID
  _BRANCH: $BRANCH_NAME
steps:

  - id: delete
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        if [[ "${_BRANCH}" != "main" ]]; then
          echo "Skipping cleanup on non-main branch"
          exit 0
        fi

        declare -A branches=()
        branches["main"]=1

        cd /workspace

        git fetch --all --prune 2>/dev/null || true

        while read -r ref; do
          [[ -z "${ref}" ]] && continue
          ref="${ref#origin/}"
          [[ "${ref}" == "HEAD" ]] && continue
          branches["${ref}"]=1
        done < <(git branch -r --format='%(refname:short)' 2>/dev/null)

        echo "Protected branches are ${!branches[*]}"

        delete() {
          local repository="$1"
          echo "Checking tags in ${repository}"
          gcloud artifacts docker tags list "${repository}" \
            --format="get(tag)" \
            --quiet \
            --filter="tag:*" \
            --limit=10000 | while read -r full; do
              [[ -z "${full}" ]] && continue
              tag="${full##*/}"
              if [[ -z "${tag}" ]]; then
                continue
              fi
              if [[ -n "${branches[${tag}]:-}" ]]; then
                echo "Keeping ${tag} (branch exists)"
                continue
              fi
              image="${repository}:${tag}"
              echo "Deleting stale image tag ${image}"
              gcloud artifacts docker images delete "${image}" \
                --project="${_PROJECT}" \
                --quiet \
                --delete-tags || true
            done
        }

        delete "${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPOSITORY}/pipelines/code"
        delete "${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPOSITORY}/pipelines/job"

  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        image="${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPOSITORY}/pipelines/code:${_BRANCH}"

        docker build --target pipelines \
          --tag "${image}" \
          .

        docker push "${image}"

        image="${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPOSITORY}/pipelines/job:${_BRANCH}"

        docker build --target job \
          --tag "${image}" \
          .

        docker push "${image}"
