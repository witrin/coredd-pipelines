options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: europe-west1
  _REPOSITORY: containers
  _PROJECT: $PROJECT_ID
  _BRANCH: $BRANCH_NAME
  _SECRET: bug-request-github-oauthtoken-88e712
steps:

  - id: delete
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        if [[ "${_BRANCH}" != "main" ]]; then
          echo "Skipping cleanup on non-main branch"
          exit 0
        fi

        token=$(gcloud secrets versions access latest \
          --secret=build-github-api-token)

        if [[ -z "${token}" ]]; then
          echo "Failed to fetch GitHub token from Secret Manager"
          exit 1
        fi

        declare -A branches=()
        branches["main"]=1

        page=1
        while :; do
          response=$(curl -sf \
            -H "Authorization: token ${token}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/witrin/coredd-pipelines/pulls?state=open&per_page=100&page=${page}")

          [[ -z "${response}" || "${response}" == "[]" ]] && break

          while read -r branch; do
            [[ -n "${branch}" ]] && branches["${branch}"]=1
          done < <(echo "${response}" | python3 -c "import sys,json; print('\n'.join(pr['head']['ref'] for pr in json.load(sys.stdin)))")

          count=$(echo "${response}" | grep -c '"number":' || true)
          [[ ${count} -lt 100 ]] && break
          ((page++))
        done

        echo "Protected branches are ${!branches[*]}"

        delete() {
          local repository="$1"
          echo "Checking tags in ${repository}"
          gcloud artifacts docker tags list "${repository}" \
            --format="get(tag)" \
            --quiet \
            --filter="tag:*" \
            --limit=10000 | while read -r full; do
              [[ -z "${full}" ]] && continue
              tag="${full##*/}"
              if [[ -z "${tag}" ]]; then
                continue
              fi
              if [[ -n "${branches[${tag}]:-}" ]]; then
                echo "Keeping ${tag}"
                continue
              fi
              image="${repository}:${tag}"
              echo "Deleting stale image tag ${image}"
              gcloud artifacts docker images delete "${image}" \
                --project="${_PROJECT}" \
                --quiet \
                --delete-tags || true
            done
        }

        delete "${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPOSITORY}/pipelines/code"
        delete "${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPOSITORY}/pipelines/job"

  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        image="${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPOSITORY}/pipelines/code:${_BRANCH}"

        docker build --target pipelines \
          --tag "${image}" \
          .

        docker push "${image}"

        image="${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPOSITORY}/pipelines/job:${_BRANCH}"

        docker build --target job \
          --tag "${image}" \
          .

        docker push "${image}"
