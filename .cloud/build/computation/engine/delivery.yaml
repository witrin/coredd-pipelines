options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: europe-west1
  _IMAGES: containers
  _PACKAGES: apt
  _TAG: $SHORT_SHA
  _ZONE: europe-west1-b
  _PROJECT: $PROJECT_ID
steps:

  - id: build
    name: hashicorp/packer:light
    entrypoint: sh
    args:
      - -c
      - |
        set -euo pipefail

        packer init .cloud/build/computation/engine/

        packer build \
          -var "project=${_PROJECT}" \
          -var "zone=${_ZONE}" \
          -var "region=${_REGION}" \
          -var "image_name=computation-${_TAG}" \
          -var "image_family=computation" \
          -var "packages=${_PACKAGES}" \
          -var "registry=${_REGION}-docker.pkg.dev" \
          .cloud/build/computation/engine/image.pkr.hcl

  - id: clear
    waitFor: ['-']
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        family="computation"
        keep=3
        max_age=7
        cutoff=$(date -d "-${max_age} days" +%Y%m%d%H%M%S 2>/dev/null || date -v-${max_age}d +%Y%m%d%H%M%S)
        images=$(gcloud compute images list --project="${_PROJECT}" --filter="family=${family}" \
          --format="csv[no-heading](name,creationTimestamp)" --sort-by="~creationTimestamp" 2>/dev/null || true)
        [[ -z "${images}" ]] && exit 0
        count=0
        while IFS=',' read -r name ts; do
          [[ -z "${name}" ]] && continue
          count=$((count + 1))
          [[ ${count} -le ${keep} ]] && continue
          created=$(echo "${ts}" | tr -d 'TZ:-' | cut -c1-14)
          [[ "${created}" -gt "${cutoff}" ]] && continue
          gcloud compute images delete "${name}" --project="${_PROJECT}" --quiet || true
        done <<< "${images}"

  - id: assign
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        export PROJECT="${_PROJECT}"
        export REGION="${_REGION}"
        export PACKAGES="${_PACKAGES}"
        export IMAGE="${_TAG}"
        export VERSION="$(date +%Y%m%d%H%M%S)"

        if ! command -v envsubst >/dev/null 2>&1; then
          apt-get update -y >/dev/null
          apt-get install -y gettext-base >/dev/null
        fi

        envsubst '$$PROJECT $$REGION $$PACKAGES $$IMAGE $$VERSION' \
          < .cloud/build/computation/engine/update.yaml \
          > /workspace/update.yaml

        if gcloud compute os-config os-policy-assignments describe engine \
          --project="$$PROJECT" \
          --location="${_ZONE}" >/dev/null 2>&1; then

          gcloud compute os-config os-policy-assignments update engine \
            --project="$$PROJECT" \
            --location="${_ZONE}" \
            --file=/workspace/update.yaml
        else
          gcloud compute os-config os-policy-assignments create engine \
            --project="$$PROJECT" \
            --location="${_ZONE}" \
            --file=/workspace/update.yaml
        fi