#cloud-config
package_update: true
package_upgrade: false
packages:
  - docker.io
  - google-osconfig-agent
  - google-cloud-sdk
  - jq

write_files:

  - path: /etc/google-cloud-ops-agent/config.yaml
    permissions: '0644'
    owner: root:root
    content: |
      logging:
        receivers:
          orchestrator:
            type: systemd_journald
        processors:
          orchestrator:
            type: exclude_logs
            match_any:
              - 'NOT jsonPayload._SYSTEMD_UNIT:"dagster-"
                AND NOT jsonPayload._SYSTEMD_UNIT="release.service"
                AND NOT jsonPayload._SYSTEMD_UNIT="dagster-locations.service"
                AND NOT jsonPayload._SYSTEMD_UNIT="dagster-locations.timer"'
          json:
            type: parse_json
            field: MESSAGE
          severity:
            type: modify_fields
            fields:
              severity:
                copy_from: jsonPayload.severity
        service:
          pipelines:
            default_pipeline:
              receivers: []
            orchestrator:
              receivers: [orchestrator]
              processors: [orchestrator, json, severity]

  - path: /root/.docker/config.json
    permissions: '0600'
    owner: root:root
    content: |
      {
        "credHelpers": {
          "${artifact_registry_host}": "gcloud"
        }
      }

  - path: /etc/systemd/system/release.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=Restart release containers when tag changes
      After=docker.service

      [Service]
      Type=oneshot
      ExecStart=/bin/systemctl restart \
        dagster-location@release.service \
        dagster-daemon.service \
        dagster-interface.service

  - path: /etc/systemd/system/release.path
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=Trigger release restarts when /etc/release.env changes

      [Path]
      PathModified=/etc/release.env
      Unit=release.service

      [Install]
      WantedBy=multi-user.target

  - path: /etc/dagster/release.env
    permissions: '0600'
    owner: root:root
    content: |
      GRPC_PORT=${branches_port_start}
      IMAGE_REPOSITORY=${pipelines_image_repository}
      IMAGE_TAG=${default_image_tag}

  - path: /etc/argilla/release.env
    permissions: '0600'
    owner: root:root
    content: |
      IMAGE_REPOSITORY=${evaluation_image_repository}
      IMAGE_TAG=${default_image_tag}

  - path: /etc/dagster/locations.env
    permissions: '0600'
    owner: root:root
    content: |
      PROJECT=${project}
      REGION=${region}
      BUCKET=${bucket}
      DATABASE=postgresql://${database_user}@${database_host}:${database_port}/${database_name}?sslmode=${database_sslmode}&password=dagster-database-password:latest
      PORTS=${branches_port_start}-${branches_port_end}
      ACCOUNT=${service_account}
      PREFIX=pipelines
      CODE_IMAGE_REPOSITORY=${code_image_repository}
      JOB_IMAGE_REPOSITORY=${job_image_repository}

  - path: /etc/dagster/workspace.yaml
    permissions: '0644'
    owner: root:root
    content: |
      load_from:
        - grpc_server:
            host: 127.0.0.1
            port: ${branches_port_start}
            location_name: main

  - path: /etc/dagster/location.env
    permissions: '0600'
    owner: root:root
    content: |
      DATABASE_HOST=${database_host}
      DATABASE_USER=${database_user}
      DATABASE_PASSWORD=${database_password}
      DATABASE_NAME=${database_name}
      CLOUD_BUCKET=${bucket}

  - path: /etc/dagster/daemon.env
    permissions: '0600'
    owner: root:root
    content: |
      DATABASE_HOST=${database_host}
      DATABASE_USER=${database_user}
      DATABASE_PASSWORD=${database_password}
      DATABASE_NAME=${database_name}
      CLOUD_BUCKET=${bucket}
      CLOUD_RUN_PROJECT=${project}
      CLOUD_RUN_REGION=${region}
      CLOUD_RUN_JOB=pipelines
      GRPC_HOST=127.0.0.1
      GRPC_PORT=${branches_port_start}

  - path: /etc/dagster/interface.env
    permissions: '0600'
    owner: root:root
    content: |
      DATABASE_HOST=${database_host}
      DATABASE_USER=${database_user}
      DATABASE_PASSWORD=${database_password}
      DATABASE_NAME=${database_name}
      CLOUD_BUCKET=${bucket}

  - path: /etc/argilla.env
    permissions: '0600'
    owner: root:root
    content: |
      ARGILLA_HOST=0.0.0.0
      ARGILLA_PORT=6900
      ARGILLA_DATABASE_HOST=${database_host}
      ARGILLA_DATABASE_PORT=${database_port}
      ARGILLA_DATABASE_SSLMODE=${database_sslmode}
      ARGILLA_DATABASE_USER=${database_user}
      ARGILLA_DATABASE_PASSWORD=${database_password}
      ARGILLA_DATABASE_NAME=argilla
      ARGILLA_DATABASE_URL=postgresql+asyncpg://${database_user}:${database_password}@${database_host}:${database_port}/argilla
      ARGILLA_ELASTICSEARCH=http://127.0.0.1:9200
      ARGILLA_REDIS_URL=redis://127.0.0.1:6379/0
      ARGILLA_AUTHENTICATION_METHOD=oauth2
      ARGILLA_OAUTH_PROVIDER=github
      ARGILLA_AUTH_OAUTH_CFG=/etc/argilla/oauth.yml
      ARGILLA_OAUTH2_GITHUB_CLIENT_ID=${github_argilla_id}
      ARGILLA_OAUTH2_GITHUB_CLIENT_SECRET=${github_argilla_secret}
      SOCIAL_AUTH_GITHUB_SCOPE=read:user,user:email
      SOCIAL_AUTH_GITHUB_ORG_NAME=bug-request

  - path: /etc/argilla/oauth.yml
    permissions: '0644'
    owner: root:root
    content: |
      providers:
        - name: github
          client_id: ${github_argilla_id}
          client_secret: ${github_argilla_secret}
          scope: "read:user,user:email"
      allowed_workspaces:
        - name: bug-request
      allow_http_redirect: false

  - path: /etc/argilla/elasticsearch.env
    permissions: '0644'
    owner: root:root
    content: |
      ES_JAVA_OPTS=-Xms512m -Xmx512m
      node.name=elasticsearch
      cluster.name=es-argilla-local
      discovery.type=single-node
      cluster.routing.allocation.disk.threshold_enabled=false
      xpack.security.enabled=false

  - path: /etc/release.env
    permissions: '0644'
    owner: root:root
    content: |
      IMAGE_TAG=${default_image_tag}

runcmd:
  - |
      if ! systemctl is-active --quiet google-cloud-ops-agent; then
        curl -sS https://dl.google.com/cloudagents/add-google-cloud-ops-agent-repo.sh \
          -o /tmp/add-google-cloud-ops-agent-repo.sh
        bash /tmp/add-google-cloud-ops-agent-repo.sh
        apt -y -o Dpkg::Options::="--force-confold" install google-cloud-ops-agent
      fi
  - [ systemctl, restart, google-cloud-ops-agent ]
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, --now, docker.service ]
  - [ systemctl, enable, dagster-location@release.service ]
  - [ systemctl, enable, dagster-daemon.service ]
  - [ systemctl, enable, dagster-interface.service ]
  - [ systemctl, enable, dagster-locations.timer ]
  - [ systemctl, enable, argilla-elastisearch.service ]
  - [ systemctl, enable, argilla-server.service ]
  - [ systemctl, enable, argilla-redis.service ]
  - [ systemctl, enable, argilla-release.path ]
  - [ systemctl, enable, --now, release.path ]
  - [ systemctl, start, dagster-location@release.service ]
  - [ systemctl, start, dagster-daemon.service ]
  - [ systemctl, start, dagster-interface.service ]
  - [ systemctl, start, dagster-locations.timer ]
  - [ systemctl, start, dagster-locations.service ]
  - [ systemctl, start, argilla-elastisearch.service ]
  - [ systemctl, start, argilla-server.service ]
  - [ systemctl, start, argilla-redis.service ]
  - [ systemctl, start, argilla-release.path ]
