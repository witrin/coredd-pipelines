options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: europe-west1
  _IMAGES: containers
  _PACKAGES: apt
  _TAG: $SHORT_SHA
  _ZONE: europe-west1-b
  _PROJECT: $PROJECT_ID
steps:
  - id: build-pipelines-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        docker build --target pipelines \
          --tag ${_REGION}-docker.pkg.dev/${_PROJECT}/${_IMAGES}/pipelines:${_TAG} \
          --tag ${_REGION}-docker.pkg.dev/${_PROJECT}/${_IMAGES}/pipelines:latest \
          .

        docker push ${_REGION}-docker.pkg.dev/${_PROJECT}/${_IMAGES}/pipelines:${_TAG}
        docker push ${_REGION}-docker.pkg.dev/${_PROJECT}/${_IMAGES}/pipelines:latest

  - id: build-evalution-image
    waitFor: ['-']
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        docker build --target evaluation \
          --tag ${_REGION}-docker.pkg.dev/${_PROJECT}/${_IMAGES}/evaluation:${_TAG} \
          --tag ${_REGION}-docker.pkg.dev/${_PROJECT}/${_IMAGES}/evaluation:latest \
          .

        docker push ${_REGION}-docker.pkg.dev/${_PROJECT}/${_IMAGES}/evaluation:${_TAG}
        docker push ${_REGION}-docker.pkg.dev/${_PROJECT}/${_IMAGES}/evaluation:latest

  - id: build-pipelines-package
    waitFor: ['-']
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        if ! command -v dpkg-deb >/dev/null 2>&1 || ! command -v envsubst >/dev/null 2>&1; then
          apt-get update -y
          apt-get install -y dpkg-dev gettext-base
        fi

        version="$(date -u +%Y%m%d%H%M%S)"
        export unit_version="$version"

        root="/workspace/dagster-cloud"

        rm -rf "$root"
        mkdir -p "$root/DEBIAN" "$root/usr/local/bin" "$root/lib/systemd/system"

        cp -R .cloud/computation/dagster/package/DEBIAN/* "$root/DEBIAN/"
        sed -i "s/__VERSION__/$version/" "$root/DEBIAN/control"

        systemd_tmp="/workspace/dagster-cloud-systemd"
        rm -rf "$systemd_tmp"
        mkdir -p "$systemd_tmp"

        for unit in .cloud/computation/dagster/systemd/*; do
          envsubst '${unit_version}' < "$unit" > "$systemd_tmp/$(basename "$unit")"
        done

        install -m 0755 .cloud/computation/dagster/synchronize-code.sh "$root/usr/local/bin/dagster-locations-synchronize"
        install -m 0644 "$systemd_tmp"/*.service "$root/lib/systemd/system/"
        install -m 0644 "$systemd_tmp"/*.timer "$root/lib/systemd/system/"
        install -m 0644 "$systemd_tmp"/*.path "$root/lib/systemd/system/"

        dpkg-deb --build "$root" "/workspace/dagster-cloud_${version}_all.deb"

        gcloud artifacts apt upload "${_PACKAGES}" \
          --project="${_PROJECT}" \
          --location="${_REGION}" \
          --source="/workspace/dagster-cloud_${version}_all.deb"

  - id: build-evaluation-package
    waitFor: ['-']
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        if ! command -v dpkg-deb >/dev/null 2>&1 || ! command -v envsubst >/dev/null 2>&1; then
          apt-get update -y
          apt-get install -y dpkg-dev gettext-base
        fi

        version="$(date -u +%Y%m%d%H%M%S)"
        export unit_version="$version"

        root="/workspace/argilla-cloud"
        rm -rf "$root"
        mkdir -p "$root/DEBIAN" "$root/lib/systemd/system"

        cp -R .cloud/computation/argilla/package/DEBIAN/* "$root/DEBIAN/"
        sed -i "s/__VERSION__/$version/" "$root/DEBIAN/control"

        systemd_tmp="/workspace/argilla-cloud-systemd"
        rm -rf "$systemd_tmp"
        mkdir -p "$systemd_tmp"

        for unit in .cloud/computation/argilla/systemd/*; do
          envsubst '${unit_version}' < "$unit" > "$systemd_tmp/$(basename "$unit")"
        done

        install -m 0644 "$systemd_tmp"/*.service "$root/lib/systemd/system/"
        install -m 0644 "$systemd_tmp"/*.path "$root/lib/systemd/system/"

        dpkg-deb --build "$root" "/workspace/argilla-cloud_${version}_all.deb"

        gcloud artifacts apt upload "${_PACKAGES}" \
          --project="${_PROJECT}" \
          --location="${_REGION}" \
          --source="/workspace/argilla-cloud_${version}_all.deb"

  - id: update-computation-setup
    waitFor:
      - build-pipelines-image
      - build-evalution-image
      - build-pipelines-package
      - build-evaluation-package
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        export PROJECT="${_PROJECT}"
        export REGION="${_REGION}"
        export PACKAGES="${_PACKAGES}"
        export IMAGE="${_TAG}"
        export VERSION="$(date +%Y%m%d%H%M%S)"

        if ! command -v envsubst >/dev/null 2>&1; then
          apt-get update -y >/dev/null
          apt-get install -y gettext-base >/dev/null
        fi

        envsubst '$$PROJECT $$REGION $$PACKAGES $$IMAGE $$VERSION' \
          < .cloud/computation/update.yaml \
          > /workspace/update.yaml

        if gcloud compute os-config os-policy-assignments describe pipelines \
          --project="$$PROJECT" \
          --location="${_ZONE}" >/dev/null 2>&1; then
          # Update existing policy (faster than delete+create)
          gcloud compute os-config os-policy-assignments update pipelines \
            --project="$$PROJECT" \
            --location="${_ZONE}" \
            --file=/workspace/update.yaml
        else
          gcloud compute os-config os-policy-assignments create pipelines \
            --project="$$PROJECT" \
            --location="${_ZONE}" \
            --file=/workspace/update.yaml
        fi
