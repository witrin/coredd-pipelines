options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: europe-west1
  _REPOSITORY: containers
  _PROJECT: $PROJECT_ID
  _BRANCH: $BRANCH_NAME
steps:
  - id: delete-location-images
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        if [[ "${_BRANCH}" != "main" ]]; then
          exit 0
        fi

        git fetch origin "+refs/heads/*:refs/remotes/origin/*" >/dev/null 2>&1 || true
        git fetch origin "+refs/pull/*/head:refs/remotes/origin/pr/*" >/dev/null 2>&1 || true

        declare -A branches=()
        while read -r ref; do
          [[ -z "${ref}" ]] && continue
          branches["${ref}"]=1
        done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | sed '/^HEAD$/d')

        delete() {
          local repository="$1"
          gcloud artifacts docker tags list "${repository}" \
            --format="get(tag)" \
            --quiet \
            --filter="tag:*" \
            --limit=10000 | while read -r full; do
              [[ -z "${full}" ]] && continue
              tag="${full##*/}"
              if [[ -z "${tag}" || -n "${branches[${tag}]:-}" ]]; then
                continue
              fi
              image="${repository}:${tag}"
              echo "Deleting stale image tag ${image}"
              gcloud artifacts docker images delete "${image}" \
                --project="${_PROJECT}" \
                --quiet \
                --delete-tags || true
            done
        }

        delete "${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPOSITORY}/pipelines/code"
        delete "${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPOSITORY}/pipelines/job"
  - id: build-location-images
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        image="${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPOSITORY}/pipelines/code:${_BRANCH}"

        docker build --target pipelines \
          --tag "${image}" \
          .

        docker push "${image}"

        image="${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPOSITORY}/pipelines/job:${_BRANCH}"

        docker build --target job \
          --tag "${image}" \
          .

        docker push "${image}"
