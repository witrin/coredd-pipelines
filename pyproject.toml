[project]
name = "benchmark"
version = "1.0.0"
description = "Dagster pipeline for scope, ingestion, discovery, tracing and evaluation of defects in code reviews."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dagster==1.12.13",
    "dagit==1.12.13",
    "dagster-postgres==0.28.13",
    "dagster-gcp==0.28.13",
    "google-cloud-bigquery",
    "google-cloud-storage",
    "polars==1.37.0",
    "pyarrow==22.0.0",
    "tqdm==4.67",
    "PyGithub==2.8.1"
]

[project.optional-dependencies]
notebooks = [
    "pytest==8.3.3",
    "ruff==0.6.4",
    "ipykernel==6.29.5",
    "marimo==0.19.11",
    "plotly==6.5.2",
    "optuna==4.7.0",
    "umap-learn==0.5.11",
    "pygam==0.12.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.dg.project]
root_module = "benchmark"
defs_module = "benchmark.definitions"
