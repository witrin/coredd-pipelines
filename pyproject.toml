[project]
name = "benchmark"
version = "1.0.0"
description = "Dagster pipeline for scope, ingestion, discovery, tracing and evaluation of defects in code reviews."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dagster==1.12.20",
    "dagster-webserver==1.12.20",
    "dagster-postgres==0.28.20",
    "dagster-gcp==0.28.20",
    "google-cloud-bigquery",
    "google-cloud-storage",
    "polars==1.37.0",
    "pyarrow==22.0.0",
    "PyGithub==2.8.1",
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==0.13.0",
    "unidiff==0.7.5",
    "langchain-core==1.2.16",
    "langgraph==1.0.10",
    "langchain-openai==1.1.10",
    "jpype1>=1.5.0",
    "optuna==4.7.0",
    "pygam==0.12.0",
    "pathspec==1.0.4",
    "pygit2==1.19.1",
    "openai==2.20.0",
    "networkx==3.6.1",
    "argilla>=2.8.0",
    "statsmodels==0.14.6",
    "lingua-language-detector==2.2.0",
    "markdown-it-py==4.0.0"
]

[project.optional-dependencies]
development = [
    "pytest==9.0.2"
]
notebooks = [
    "ruff==0.6.4",
    "ipykernel==6.29.5",
    "plotly==6.5.2",
    "umap-learn==0.5.11",
    "tqdm==4.67.1",
    "ipywidgets==8.1.7",
    "nbformat==5.10.4",
    "widgetsnbextension==4.0.15",
    "jupyterlab_widgets==3.0.16",
    "anywidget==0.11.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.dg.project]
root_module = "benchmark"
defs_module = "benchmark.definitions"
