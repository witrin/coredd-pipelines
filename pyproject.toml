[project]
name = "benchmark"
version = "1.0.0"
description = "Dagster pipeline for scope, ingestion, discovery, tracing and evaluation of defects in code reviews."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dagster==1.12.13",
    "dagit==1.12.13",
    "dagster-postgres==0.28.13",
    "dagster-gcp==0.28.13",
    "google-cloud-bigquery",
    "google-cloud-storage",
    "tqdm==4.67"
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.6.4",
    "ipykernel==6.29.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.dg.project]
root_module = "benchmark"
defs_module = "benchmark.definitions"
