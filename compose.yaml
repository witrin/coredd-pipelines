services:

    pipelines:
        build:
            context: .
            target: pipelines
            dockerfile: Dockerfile
        profiles: [ development ]
        environment:
            DAGSTER_DEPLOYMENT_MODE: local
            DAGSTER_HOME: /var/lib/dagster
            PYTHONPATH: /usr/local/src
        command: >
            dagster dev -h 0.0.0.0 -p 3000 -w /etc/dagster/workspace.yaml
        ports:
            - 3000:3000
        volumes:
            - .dagster/local/storage:/var/lib/dagster
            - .dagster/local/dagster.yaml:/etc/dagster/dagster.yaml:ro
            - .dagster/local/workspace.yaml:/etc/dagster/workspace.yaml:ro
            - .dagster/local/logs:/var/log/dagster
            - ./src:/usr/local/src/benchmark

    lock:
        image: python:3.11-slim
        working_dir: /usr/local/src
        profiles: [ dependencies ]
        command: >
            sh -c "
              pip install --no-cache-dir pip-tools &&
              pip-compile pyproject.toml --output-file requirements.lock
            "

    console:
        build:
            context: .
            dockerfile: Dockerfile
            target: console
        stdin_open: true
        tty: true
        profiles: [ deployment ]
        volumes:
            - ./.cloud:/workspace
            - ~/.config/gcloud:/root/.config/gcloud
