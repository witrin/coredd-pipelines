[supervisord]
logfile=/var/log/dagster/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=true

[program:dagster-grpc]
command=dagster api grpc -h 0.0.0.0 -p 9090 -f /usr/local/src/benchmark/definitions.py
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dagster-daemon]
command=dagster-daemon run -f /usr/local/src/benchmark/definitions.py
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
