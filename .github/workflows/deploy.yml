name: deploy

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set build version
        if: github.event_name == 'pull_request'
        working-directory: .jupyter
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          build = "${{ github.run_number }}"
          path = Path("pyproject.toml")
          text = path.read_text()
          def repl(match):
              base = match.group(1)
              return f'version = "{base}+build{build}"'
          updated = re.sub(r'version\\s*=\\s*"([0-9]+\\.[0-9]+\\.[0-9]+)"', repl, text, count=1)
          path.write_text(updated)
          PY
      - name: Build
        working-directory: .jupyter
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: .jupyter/dist
          repository-url: https://pip.pkg.github.com/bug-request/
          user: __token__
          password: ${{ secrets.GITHUB_TOKEN }}
