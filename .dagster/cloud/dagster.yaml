storage:
    postgres:
        postgres_db:
            username:
              env: DATABASE_USER
            password:
              env: DATABASE_PASSWORD
            hostname:
              env: DATABASE_HOST
            db_name:
              env: DATABASE_NAME

compute_logs:
  module: dagster._core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /var/log/dagster

local_artifact_storage:
  module: dagster._core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /var/lib/dagster

concurrency:
  default_op_concurrency_limit: 50

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    dequeue_interval_seconds: 1
    dequeue_use_threads: true
    dequeue_num_workers: 10
    max_concurrent_runs: 50

run_monitoring:
  enabled: true
  poll_interval_seconds: 120
  max_resume_run_attempts: 0
  start_timeout_seconds: 300
  cancel_timeout_seconds: 300

telemetry:
  enabled: false
run_launcher:
  module: components.launcher
  class: CloudRunJobRunLauncher
  config:
    project:
      env: CLOUD_RUN_PROJECT
    region:
      env: CLOUD_RUN_REGION
    job:
      env: CLOUD_RUN_JOB
