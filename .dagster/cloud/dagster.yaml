storage:
    postgres:
        postgres_db:
            username: ${PG_USER}
            password: ${PG_PASSWORD}
            hostname: ${PG_HOST}
            db_name: ${PG_DATABASE}

run_storage:
    postgres:
        postgres_db:
            username: ${PG_USER}
            password: ${PG_PASSWORD}
            hostname: ${PG_HOST}
            db_name: ${PG_DATABASE}

event_log_storage:
    postgres:
        postgres_db:
            username: dagster
            password: ${PG_PASSWORD}
            hostname: ${PG_HOST}
            db_name: ${PG_DATABASE}

telemetry:
    enabled: false

compute_logs:
    base_dir: /var/log/dagster

local_artifact_storage:
    base_dir: /var/lib/dagster
