storage:
    sqlite:
        base_dir: /var/lib/dagster

run_coordinator:
  module: dagster._core.run_coordinator.queued_run_coordinator
  class: QueuedRunCoordinator
  config:
    tag_concurrency_limits:
      - key: "concurrency"
        value: "github"
        limit: 3

compute_logs:
  module: dagster._core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /var/log/dagster

local_artifact_storage:
  module: dagster._core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /var/lib/dagster

telemetry:
  enabled: false

run_launcher:
  module: components.launcher
  class: CloudRunJobRunLauncher
  config:
    project:
      env: CLOUD_RUN_PROJECT
    region:
      env: CLOUD_RUN_REGION
    job:
      env: CLOUD_RUN_JOB
